{% extends "base.html" %}
{% block title %}ورود یا ثبت‌نام | ویونت{% endblock %}
{% block content %}
<section class="py-5"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-2">ورود یا ثبت‌نام</h1>
    <p class="text-muted">شمارهٔ موبایل خود را وارد کنید تا کد تأیید برایتان پیامک شود.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="{{ form.phone.id_for_label }}">{{ form.phone.label }}</label>
        {{ form.phone }}
        {% for e in form.phone.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
      </div>
      <button class="btn btn-primary w-100" type="submit">دریافت کد تأیید</button>
    </form>
  </div></div>
</div></div></div></section>
{% endblock %}
